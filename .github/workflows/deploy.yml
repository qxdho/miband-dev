name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# 只有一个 job。
# build 和 deploy 拆成两个 job 时，第二个 job 要重新排队、重新启动环境，
# 在白拿的固定开销面前，构建本身只要 5 秒。
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 用 Node 自带的 corepack 装 pnpm，省掉 pnpm/action-setup 这一步。
      # 版本号来自 package.json 的 packageManager 字段（pnpm@11.7.0），
      # 两边不会不一致。
      #
      # 注意：setup-node 的 cache: pnpm 必须等 pnpm 装好之后才能用，
      # 所以这里的顺序是「先 setup-node（不开缓存）→ 装 pnpm → 再 setup-node 开缓存」。
      # 写成一步会在 setup-node 阶段直接报错（Unable to locate executable file: pnpm）。
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable && corepack install

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate frontmatter & models.json
        run: pnpm check:frontmatter

      - name: Build site
        run: pnpm docs:build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

      - id: deployment
        uses: actions/deploy-pages@v4
