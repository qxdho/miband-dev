name: Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate frontmatter & models.json
        run: pnpm check:frontmatter

      - name: Build site
        run: pnpm docs:build

      - name: Upload dist (debug artifact)
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: docs/.vitepress/dist
          retention-days: 7
